apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-app-deployment
  labels:
    app: springboot-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: springboot-app
  template:
    metadata:
      labels:
        app: springboot-app
    spec:
      containers:
        - name: springboot-app
          image: aplicatie-spring-boot:latest # Trebuie să coincidă cu numele imaginii construite local
          imagePullPolicy: Never # K8s va căuta imaginea pe PC-ul tău, fără să o descarce de pe internet
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: springboot-app-service
spec:
  type: NodePort
  selector:
    app: springboot-app
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081 # Aplicația va fi accesibilă pe PC-ul tău la http://localhost:30080