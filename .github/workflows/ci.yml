name: Java Spring Boot CI (Local Verification)

# Specifică evenimentele care declanșează rularea automată
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    # Mașina virtuală gratuită oferită de GitHub
    runs-on: ubuntu-latest

    steps:
      # 1. Extrage codul sursă din repozitoriul tău pe mașina de build
      - name: Extragere cod din GitHub
        uses: actions/checkout@v4

      # 2. Configurează mediul de execuție Java (JDK 17)
      - name: Configurare JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Compilează codul Java și verifică dacă totul este corect
      # Notă: Dacă ai teste care necesită o bază de date reală activă și vrei să le eviți momentan,
      # poți lăsa flag-ul -DskipTests. Dacă vrei să rulezi și testele, folosește doar: mvn clean package
      - name: Compilare proiect cu Maven (Verify Build)
        run: mvn clean package -DskipTests