name: Java Spring Boot CI/CD (Build & Push to GitHub Packages)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Extragere cod din GitHub
        uses: actions/checkout@v4

      # --- PASUL NOU: Transformăm numele repozitoriului în litere mici ---
      - name: Setează numele repozitoriului în litere mici
        id: string
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Configurare Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autentificare în GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # În pasul de mai jos am înlocuit github.repository cu variabila modificată REPO_LOWER
      - name: Construire și Push Imagine Docker (CI/CD)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/shopping-tracker:latest
            ghcr.io/${{ env.REPO_LOWER }}/shopping-tracker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max